<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantry Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-4 sm:p-6 font-sans">

  <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
    
    <!-- Header -->
    <header class="bg-slate-900 text-white p-5 border-b border-slate-800 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold tracking-tight">Pantry Inventory</h1>
        <p class="text-slate-400 text-sm">Quick log for items and quantities</p>
      </div>
      <div id="total-count" class="text-sm font-semibold bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
        0 Items
      </div>
    </header>

    <div class="p-5 space-y-6">

      <!-- Fast Entry Form -->
      <form id="inventory-form" class="grid grid-cols-1 sm:grid-cols-12 gap-3 bg-slate-50 p-4 rounded-lg border border-slate-200">
        <div class="sm:col-span-5">
          <label for="item-name" class="block text-xs font-bold uppercase text-slate-600 mb-1">Item Name</label>
          <input type="text" id="item-name" required placeholder="e.g. Black Beans, All-Purpose Flour" 
            class="w-full text-base px-3 py-2.5 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-800 text-slate-900 font-medium placeholder-slate-400">
        </div>

        <div class="sm:col-span-3">
          <label for="item-category" class="block text-xs font-bold uppercase text-slate-600 mb-1">Category</label>
          <select id="item-category" 
            class="w-full text-base px-3 py-2.5 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-800 text-slate-900 font-medium">
            <option value="Canned Goods">Canned Goods</option>
            <option value="Dry Goods & Pasta">Dry Goods & Pasta</option>
            <option value="Baking">Baking</option>
            <option value="Spices & Seasonings">Spices & Seasonings</option>
            <option value="Oils & Condiments">Oils & Condiments</option>
            <option value="Snacks">Snacks</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="sm:col-span-2">
          <label for="item-qty" class="block text-xs font-bold uppercase text-slate-600 mb-1">Qty</label>
          <input type="number" id="item-qty" min="1" value="1" required 
            class="w-full text-base px-3 py-2.5 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-800 text-slate-900 font-bold text-center">
        </div>

        <div class="sm:col-span-2 flex items-end">
          <button type="submit" 
            class="w-full text-base bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 px-4 rounded-md transition duration-150 shadow-sm active:bg-slate-950">
            + Add
          </button>
        </div>
      </form>

      <!-- Search & Category Filters -->
      <div class="flex flex-col sm:flex-row gap-3 justify-between items-center border-b border-slate-200 pb-4">
        <input type="text" id="search-input" placeholder="Filter inventory..." 
          class="w-full sm:w-64 text-sm px-3 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-800">
        
        <div class="flex gap-2 w-full sm:w-auto overflow-x-auto pb-1 sm:pb-0">
          <select id="filter-category" class="text-sm px-3 py-2 bg-white border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-slate-800 text-slate-700">
            <option value="All">All Categories</option>
            <option value="Canned Goods">Canned Goods</option>
            <option value="Dry Goods & Pasta">Dry Goods & Pasta</option>
            <option value="Baking">Baking</option>
            <option value="Spices & Seasonings">Spices & Seasonings</option>
            <option value="Oils & Condiments">Oils & Condiments</option>
            <option value="Snacks">Snacks</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <!-- Inventory List -->
      <div class="overflow-hidden border border-slate-200 rounded-lg">
        <ul id="inventory-list" class="divide-y divide-slate-200 bg-white">
          <!-- Items render here -->
        </ul>
      </div>

    </div>
  </div>

  <script>
    let inventory = JSON.parse(localStorage.getItem('pantry_inventory')) || [];

    const form = document.getElementById('inventory-form');
    const nameInput = document.getElementById('item-name');
    const categoryInput = document.getElementById('item-category');
    const qtyInput = document.getElementById('item-qty');
    const list = document.getElementById('inventory-list');
    const searchInput = document.getElementById('search-input');
    const filterCategory = document.getElementById('filter-category');
    const totalCount = document.getElementById('total-count');

    function saveAndRender() {
      localStorage.setItem('pantry_inventory', JSON.stringify(inventory));
      render();
    }

    function render() {
      const query = searchInput.value.toLowerCase();
      const catFilter = filterCategory.value;

      list.innerHTML = '';

      const filtered = inventory.filter(item => {
        const matchesSearch = item.name.toLowerCase().includes(query);
        const matchesCategory = catFilter === 'All' || item.category === catFilter;
        return matchesSearch && matchesCategory;
      });

      totalCount.textContent = `${inventory.length} Unique ${inventory.length === 1 ? 'Item' : 'Items'}`;

      if (filtered.length === 0) {
        list.innerHTML = `<li class="p-8 text-center text-slate-500 text-base font-medium">No items found.</li>`;
        return;
      }

      filtered.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:bg-slate-50 transition';

        li.innerHTML = `
          <div class="flex-1">
            <span class="text-lg font-bold text-slate-900 block leading-snug">${escapeHtml(item.name)}</span>
            <span class="inline-block mt-1 text-xs font-semibold uppercase tracking-wider text-slate-600 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">${escapeHtml(item.category)}</span>
          </div>

          <div class="flex items-center gap-4 justify-between sm:justify-end">
            <div class="flex items-center border border-slate-300 rounded-md bg-white overflow-hidden shadow-sm">
              <button onclick="updateQty('${item.id}', -1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-lg active:bg-slate-300 transition">-</button>
              <span class="px-4 py-1.5 font-bold text-slate-900 text-base min-w-[2.5rem] text-center">${item.qty}</span>
              <button onclick="updateQty('${item.id}', 1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold text-lg active:bg-slate-300 transition">+</button>
            </div>

            <button onclick="removeItem('${item.id}')" class="text-rose-600 hover:text-rose-800 font-semibold text-sm px-2 py-1 rounded hover:bg-rose-50 transition">
              Delete
            </button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;

      const existingIndex = inventory.findIndex(i => i.name.toLowerCase() === name.toLowerCase() && i.category === categoryInput.value);

      if (existingIndex > -1) {
        inventory[existingIndex].qty += parseInt(qtyInput.value, 10);
      } else {
        inventory.push({
          id: Date.now().toString(),
          name: name,
          category: categoryInput.value,
          qty: parseInt(qtyInput.value, 10)
        });
      }

      nameInput.value = '';
      qtyInput.value = '1';
      nameInput.focus();
      saveAndRender();
    });

    window.updateQty = function(id, delta) {
      const item = inventory.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        removeItem(id);
      } else {
        saveAndRender();
      }
    };

    window.removeItem = function(id) {
      inventory = inventory.filter(i => i.id !== id);
      saveAndRender();
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[m]);
    }

    searchInput.addEventListener('input', render);
    filterCategory.addEventListener('change', render);

    render();
  </script>
</body>
</html>
